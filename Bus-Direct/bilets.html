<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="BusDirect : liste des billets réservés pour la ligne Safi - Marrakech.">
    <title>BusDirect | Billets</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="grid grid-cols-1 md:grid-cols-[15%_85%] min-h-screen bg-gray-500 font-sans">

    <header class="bg-gray-500 md:h-screen md:sticky md:top-0 py-5 border-r-4">
        <img src="img/logo.png" alt="BusDirect" class="w-[80px] ml-4">
        <nav aria-label="Navigation principale">
            <ul class="flex md:flex-col gap-2 mt-6 list-none p-0">
                <li><a href="index.html"
                        class="block text-white px-4 py-2 hover:bg-white/15">Réservations</a></li>
                <li><a href="#billets" aria-current="page"
                        class="block text-white px-4 py-2 bg-white/15">Billets</a></li>
            </ul>
        </nav>
    </header>

    <main class="pb-6" id="billets">
<!-- 2 header -->
        <section class="flex justify-between items-center bg-white px-6 py-4">
            <div>
                <h1 class="text-2xl font-bold">Billets</h1>
                <p class="text-gray-500">Billets réservés — Safi → Marrakech</p>
            </div>
            <i class="text-2xl text-amber-600" aria-hidden="true"></i>
        </section>

     <section class="p-6">
     <div class="bg-white rounded-2xl border  p-6 shadow-sm">
    <h3 class="text-md font-bold mb-3">Liste des Passagers</h3>

    <div class="overflow-x-auto">
        <table class="w-full text-sm text-left">
            <thead class=" text-xs">
                <tr>
                    <th class="px-4 py-3">Passager</th>
                    <th class="px-4 py-3">Siège</th>
                    <th class="px-4 py-3">Tarif</th>
                    <th class="px-4 py-3">Statut</th>
                </tr>
            </thead>

            <tbody id="passenger" class="divide-y ">
            </tbody>
        </table>
    </div>
</div>
</section>

    </main>
    
    <script src="js/billets.js" defer></script>
</body>
</html>
